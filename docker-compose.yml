version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dashboard-financas
    restart: always
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashfinance08
      POSTGRES_DB: db_financas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: